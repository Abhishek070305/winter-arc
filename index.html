<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function calsum(){
        const a = document.getElementById("first").value;
        const b = document.getElementById("second").value;
        const element = document.getElementById("findsum");
        element.innerHTML = parseInt(a)+parseInt(b);
        
    }
</script>
<body>
    <input id = "first" type = "text" placeholder = "first number"></input><br></br>
    <input id = "second" type = "text" placeholder = "second number"></input><br></br>
    <button onclick = "calsum()">Calculate sum</button>
    <div id="findsum"></div>
</html>
